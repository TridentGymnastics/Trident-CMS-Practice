                    summary: "{fields.alt}"
                description: Add, replace or drag photo rows to reorder them. Removing a row
                  removes it from this gallery, not from the media library.
              - name: video
                label: Existing video
                type: object
                required: true
                description: Show or hide the existing video. Photos are the supported upload
                  option for staff.
                fields:
                  - name: enabled
                    label: Show video
                    type: boolean
                    required: true
                    description: Show/hide the existing UrbanGym video. Staff upload photos here;
                      replacing the video needs technical help.
            description: Expand to select and arrange the photos on this program page.
      - name: program_agc
        label: AGC
        type: file
        path: src/content/program-agc.json
        format: json
        operations:
          create: false
          rename: false
          delete: false
        fields:
          - name: title
            label: Program name
            type: string
            required: true
            description: "Before editing: check live versus practice repository. Save this
              page before opening another editor, then check the website after
              deployment. Updates the page, menu, program cards and gallery
              heading. The page address stays the same."
            options:
              maxlength: 60
          - name: blurb
            label: Program page introduction
            type: text
            required: true
            description: Used on the program page, homepage card and search description.
          - name: colorScheme
            label: Header colour scheme
            type: select
            required: true
            options:
              values:
                - name: primary
                  label: Blue
                - name: secondary
                  label: Navy
                - name: accent
                  label: Yellow
                - name: primary-secondary
                  label: Blue to navy
                - name: secondary-accent
                  label: Navy to yellow
                - name: ocean
                  label: Ocean blue
                - name: forest
                  label: Forest green
                - name: violet
                  label: Violet
                - name: berry
                  label: Berry
                - name: sunshine
                  label: Sunshine
                - name: mint
                  label: Fresh mint
                - name: peach
                  label: Peach
                - name: lavender
                  label: Soft lavender
            description: Choose a prepared header palette. Text colours are paired
              automatically. Photos and holiday themes are unchanged.
          - name: levels
            label: Existing programs / levels
            type: object
            required: true
            fields:
              - name: id
                label: Internal class identity
                type: string
                required: true
                hidden: true
                readonly: true
              - name: name
                label: Level name
                type: string
                required: true
                options:
                  maxlength: 60
                description: Level name only, without the program prefix. The program name is
                  added automatically where needed.
              - name: description
                label: Level description
                type: text
                required: true
                description: Brief explanation for families. Review it when the program,
                  document or offer changes.
            list:
              min: 2
              max: 2
              collapsible:
                collapsed: true
                summary: "{fields.name}"
            description: Expand a level to edit its name, school-year label and description.
              Bookings and class times are managed in iClassPro.
          - name: media
            label: Photos
            type: object
            required: false
            fields:
              - name: photos
                label: Photos
                type: object
                required: false
                fields:
                  - name: src
                    label: Photo
                    type: image
                    required: true
                    options:
                      media: program_photos
                    description: Select an existing photo or upload one the club has permission to
                      publish. Keep library files that other pages may use.
                  - name: alt
                    label: Describe this photo
                    type: string
                    required: true
                    description: Describe the activity without naming children.
                  - name: position
                    label: Crop position
                    type: select
                    description: Choose which part of the photo stays visible in its crop.
                    default: center
                    options:
                      values:
                        - name: center
                          label: Centre
                        - name: center top
                          label: Top
                        - name: center bottom
                          label: Bottom
                        - name: left
                          label: Left
                        - name: right
                          label: Right
                list:
                  min: 0
                  max: 6
                  collapsible:
                    collapsed: true
                    summary: "{fields.alt}"
                description: Add, replace or drag photo rows to reorder them. Removing a row
                  removes it from this gallery, not from the media library.
            description: Expand to select and arrange the photos on this program page.
      - name: parties
        label: Birthday parties
        type: file
        path: src/content/parties.json
        format: json
        operations:
          create: false
          rename: false
          delete: false
        fields:
          - name: introduction
            label: Introduction
            type: text
            required: true
            description: "Before editing: check live versus practice repository. Save this
              page before opening another editor, then check the website after
              deployment. Welcoming introduction to this page. Keep it concise
              and check it matches the current offer."
          - name: booking_url
            label: Party booking link
            type: string
            required: true
            pattern:
              regex: ^https://[^\s]+$
              message: Use a full https:// address.
            description: Paste the full https:// booking address. Open it to check it
              reaches the correct iClassPro booking page.
          - name: packages
            label: Packages
            type: object
            required: true
            fields:
              - name: name
                label: Package
                type: string
                required: true
                description: Enter the name shown on the website. Use the correct spelling and
                  keep it brief.
              - name: capacity
                label: Guest numbers
                type: string
                required: true
                description: Guest allowance, for example Up to 20 children. Clarify whether the
                  birthday child is included.
              - name: price
                label: Price
                type: string
                required: true
                description: Include the dollar sign and who the price covers, for example $15
                  per child. This does not change iClassPro prices.
            list:
              min: 1
              max: 5
              collapsible:
                collapsed: true
                summary: "{fields.name}"
            description: Expand each existing party package to update its name, guest
              capacity and price. Update booking and payment arrangements
              separately.
          - name: payment_note
            label: Deposit and payment information
            type: text
            required: true
            description: Explain the current deposit and payment arrangements. Match the
              booking terms.
          - name: schedule
            label: Party times
            type: text
            required: true
            description: Each item is a line of party session times. This does not change
              availability in the booking system.
          - name: details
            label: What families need to know
            type: text
            required: true
            list:
              min: 1
              max: 10
            description: Each item is a practical instruction for party families, such as
              arrival time or what to bring.
  - name: club_information
    label: Club information
    type: group
    items:
      - name: homepage
        label: Homepage
        type: file
        path: src/content/homepage.json
        format: json
        operations:
          create: false
          rename: false
          delete: false
        fields:
          - name: heading
            label: Main heading
            type: string
            required: true
            options:
              maxlength: 100
            description: "Before editing: check live versus practice repository. Save this
              page before opening another editor, then check the website after
              deployment. Main heading over the homepage photos/video. Keep it
              short enough to read comfortably on a phone."
          - name: introduction
            label: Welcome description
            type: text
            required: true
            options:
              maxlength: 350
            description: Welcome paragraph beneath the homepage slogan. Explain who the club
              helps and where it is.
          - name: hero_style
            label: Hero colour preset
            type: select
            required: true
            options:
              values:
                - name: original
                  label: Original Trident
                - name: ocean
                  label: Ocean
                - name: violet
                  label: Violet
                - name: forest
                  label: Forest
                - name: navy
                  label: Navy
            description: Choose the homepage colour overlay. Existing photos and videos stay
              the same. Holiday colours are selected separately.
          - name: trial_label
            label: Trial button label
            type: string
            required: true
            options:
              maxlength: 40
            description: Label on the trial button. Its destination stays the existing
              iClassPro portal; describe that action accurately.
          - name: classes_label
            label: Classes button label
            type: string
            required: true
            options:
              maxlength: 40
            description: Label on the button that scrolls to the program cards below.
          - name: classes_heading
            label: Programs section heading
            type: string
            required: true
            options:
              maxlength: 120
            description: Heading above the homepage program cards. Program names are edited
              in their program editors.
          - name: classes_intro
            label: Programs section introduction
            type: text
            required: true
            options:
              maxlength: 400
            description: Introduction above the program cards. Each card description comes
              from its program editor.
          - name: show_holiday_promo
            label: Show holiday promotion
            type: boolean
            default: true
            description: Show/hide the homepage holiday promotion. It only appears when
              Holiday Program status is Open as well.
          - name: show_season_decoration
            label: Show seasonal decorations on homepage
            type: boolean
            default: true
            description: Show/hide homepage seasonal decorations. They only appear when
              holidays are Open; select the season in Holiday Program.
          - name: show_testimonials
            label: Show parent testimonials
            type: boolean
            default: true
            description: Show/hide the existing parent testimonials. This switch does not
              edit the reviews.
          - name: show_about
            label: Show club introduction
            type: boolean
            default: true
            description: Show/hide the homepage club introduction. The separate About page
              stays available.
      - name: app_guides
        label: iClassPro App Guides
        type: file
        path: src/content/app-guides.json
        format: json
        fields:
          - name: documents
            label: Guides
            type: object
            required: false
            fields:
              - name: title
                label: Document title
                type: string
                required: true
                description: Heading or document title families will see. Include the year for
                  an annual policy.
              - name: href
                label: PDF document
                type: file
                required: true
                options:
                  media: guides
                  extensions:
                    - pdf
                description: Select or upload the replacement PDF, then update its title and
                  description. This changes the link, not the PDF contents. Use
                  a new filename for a new version.
              - name: description
                label: Description
                type: text
                description: Brief explanation for families. Review it when the program,
                  document or offer changes.
            list:
              min: 0
              max: 30
              collapsible:
                collapsed: true
                summary: "{fields.title}"
            description: "Before editing: check live versus practice repository. Save this
              page before opening another editor, then check the website after
              deployment. Expand a document to update its title, PDF and
              description. Add an item for a new document; drag items to change
              their order."
      - name: term_dates
        label: Term dates
        type: file
        path: src/content/term-dates.json
        format: json
        operations:
          create: false
          rename: false
          delete: false
        fields:
          - name: title
            label: Heading
            type: string
            required: true
            description: "Before editing: check live versus practice repository. Save this
              page before opening another editor, then check the website after
              deployment. Heading or document title families will see. Include
              the year for an annual policy."
          - name: image
            label: Calendar image
            type: image
            required: true
            options:
              media: term_dates
            description: Upload the replacement term-calendar image. Create the calendar
              artwork outside the CMS first, then check every date is readable
              on a phone.
          - name: note
            label: Short note
            type: text
            required: false
            description: Extra information accompanying this page. Keep it relevant and
              current.
      - name: about
        label: About
        type: file
        path: src/content/about.json
        format: json
        operations:
          create: false
          rename: false
          delete: false
        fields:
          - name: hero
            label: About page heading
            type: object
            required: true
            fields:
              - name: title
                label: Title
                type: string
                required: true
                description: Heading or document title families will see. Include the year for
                  an annual policy.
              - name: intro
                label: Introduction
                type: text
                required: true
                description: Brief introduction to this section for families.
            description: "Before editing: check live versus practice repository. Save this
              page before opening another editor, then check the website after
              deployment. Heading and introduction at the top of the About
              page."
          - name: bios
            label: People
            type: object
            required: true
            fields:
              - name: name
                label: Name
                type: string
                required: true
                description: Enter the name shown on the website. Use the correct spelling and
                  keep it brief.
              - name: body
                label: Biography paragraphs
                type: text
                required: true
                list:
                  min: 1
                  max: 20
                description: Write this staff member introduction in plain language. Include
                  only details approved for publication.
              - name: image
                label: Portrait
                type: image
                required: true
                options:
                  media: about_photos
                description: Choose an existing image or upload its replacement. Check it looks
                  clear on a phone after deployment.
            list:
              min: 1
              max: 10
              collapsible:
                collapsed: true
                summary: "{fields.name}"
            description: Expand each person to edit their name, introduction and portrait.
              Add or remove people when the team changes; drag rows to reorder.
          - name: closing
            label: Closing paragraphs
            type: text
            required: true
            list:
              min: 1
              max: 20
            description: Closing paragraph on the About page. Review it when the club story
              or team changes.
      - name: club_details
        label: Phone, email and opening hours
        type: file
        path: src/content/club-details.json
        format: json
        operations:
          create: false
          rename: false
          delete: false
        fields:
          - name: phone
            label: Phone number
            type: string
            required: true
            pattern:
              regex: ^0[23478][0-9 ]{8,14}$
              message: Enter an Australian phone number, such as 0435 060 352.
            description: "Before editing: check live versus practice repository. Save this
              page before opening another editor, then check the website after
              deployment. Club telephone number, including the area code where
              needed. Used by shared website contact details."
          - name: email
            label: Email
            type: string
            required: true
            pattern:
              regex: ^[^\s@]+@[^\s@]+\.[^\s@]+$
              message: Enter an email address.
            description: Club email address without spaces. Updates website email links; it
              does not create a mailbox.
          - name: opening_hours
            label: Opening hours
            type: text
            required: true
            description: Each item is a line of opening-hours information. Keep days and
              times clear and confirm current operations.
