# Practice repository only. Staff instructions: CMS-STAFF-GUIDE.md
settings:
  content:
    merge: true
media:
  - name: program_photos
    label: Program and news photos
    input: src/assets/images
    output: /src/assets/images
    extensions:
      - jpg
      - jpeg
      - png
      - webp
      - avif
    rename: safe
  - name: about_photos
    label: About portraits and logos
    input: public/Images/About
    output: /Images/About
    extensions:
      - jpg
      - jpeg
      - png
      - webp
      - avif
    rename: safe
  - name: policies
    label: Policy PDFs
    input: public/policies
    output: /policies
    extensions:
      - pdf
    rename: safe
  - name: guides
    label: Parent guide PDFs
    input: public/guides
    output: /guides
    extensions:
      - pdf
    rename: safe
  - name: program_videos
    label: Program videos
    input: public/videos/programs
    output: /videos/programs
    extensions:
      - mp4
    rename: safe
content:
  - name: site_notice
    label: PRACTICE - Site-wide notice
    type: file
    path: src/content/site-notice.json
    format: json
    operations:
      create: false
      rename: false
      delete: false
    fields:
      - name: enabled
        label: Show this notice
        type: boolean
        required: true
        description: Off hides the notice on every page. Saving changes rebuilds the practice site.
      - name: tone
        label: Notice colour
        type: select
        required: true
        options:
          values:
            - name: info
              label: Blue information notice
            - name: important
              label: Yellow important notice
      - name: heading
        label: Heading
        type: string
        required: true
      - name: message
        label: Message
        type: text
      - name: link_text
        label: Optional link text
        type: string
      - name: link_href
        label: Optional link destination
        type: string
        pattern:
          regex: (?:^$)|(?:^(?:/(?!/)[^\\\s]*|https://[^\s]+|#[A-Za-z][A-Za-z0-9_-]*)$)
          message: Use a page path such as /playgym, or a full https:// address.
  - name: playgym_practice
    label: PRACTICE - PlayGym
    type: file
    path: src/content/playgym.json
    format: json
    operations:
      create: false
      rename: false
      delete: false
    fields:
      - name: title
        label: Program name
        type: string
        required: true
        description: Shared by the page heading, navigation, program cards and class finder. URLs and booking IDs stay
          the same. Review names written inside paragraphs and PDFs separately.
        options:
          maxlength: 60
      - name: age_range
        label: Age range
        type: string
        required: true
        description: Use years, e.g. 0–6 years or 1.5–5 years. The upper value is the maximum exact age; the class
          finder asks for help if an age group only partly fits.
        pattern:
          regex: ^[0-9]+(?:\.[0-9]+)?[–-][0-9]+(?:\.[0-9]+)? years$
          message: Use a range such as 0–6 years.
      - name: session_length
        label: Session length
        type: string
        required: true
      - name: adult_helper_required
        label: Adult helper required
        type: boolean
        required: true
        description: Updates supervision labels on the website. Also review your written descriptions and policies
          when changing how sessions operate.
      - name: tagline
        label: Short description
        type: text
        required: true
      - name: about
        label: About PlayGym paragraphs
        type: text
        required: true
        list:
          min: 1
          max: 20
      - name: schedule
        label: Regular PlayGym timetable
        type: object
        required: true
        fields:
          - name: stay_notice
            label: Stay notice
            type: text
            required: true
          - name: days
            label: Sessions
            type: object
            required: true
            fields:
              - name: day
                label: Day
                type: select
                required: true
                options:
                  values:
                    - Monday
                    - Tuesday
                    - Wednesday
                    - Thursday
                    - Friday
                    - Saturday
                    - Sunday
              - name: time
                label: Session time
                type: string
                required: true
                pattern:
                  regex: ^(?:[1-9]|1[0-2]):[0-5][0-9](?:am|pm) [–—-] (?:[1-9]|1[0-2]):[0-5][0-9](?:am|pm)$
                  message: Use 11:00am - 12:30pm, with spaces around the dash.
              - name: isNew
                label: Show New badge
                type: boolean
            list:
              min: 1
              max: 21
              collapsible:
                collapsed: true
                summary: "{fields.day}"
            description: Updates the PlayGym page AND class finder. Holiday sessions have a separate seasonal calendar.
          - name: holiday_notice
            label: Holiday timetable notice
            type: text
            required: true
          - name: holiday_link_href
            label: Holiday information page
            type: string
            pattern:
              regex: ^(?:/(?!/)[^\\\s]*|https://[^\s]+|#[A-Za-z][A-Za-z0-9_-]*)$
              message: Use a page path such as /playgym, or a full https:// address.
            required: true
      - name: prices
        label: Prices and passes
        type: object
        required: true
        fields:
          - name: intro
            label: Payment introduction
            type: text
            required: true
          - name: items
            label: Pass options
            type: object
            required: true
            fields:
              - name: label
                label: Pass name
                type: string
                required: true
              - name: price
                label: Displayed price
                type: string
                required: true
              - name: savings
                label: Price per visit
                type: string
              - name: savings_detail
                label: Price per visit explanation
                type: string
            list:
              min: 1
              max: 8
              collapsible:
                collapsed: true
                summary: "{fields.label}"
            description: "Keep the single visit price first: the holiday PlayGym section also reads it. Update savings and
              the summary manually when prices change."
          - name: multi_visit_note
            label: Pass savings summary
            type: text
            required: true
          - name: gift_blurb
            label: Gift description
            type: text
            required: true
      - name: how_to_join
        label: How to join
        type: object
        required: true
        fields:
          - name: text
            label: Instructions
            type: text
            required: true
          - name: note
            label: Extra note
            type: text
            required: true
      - name: cta
        label: Call to action
        type: object
        required: true
        fields:
          - name: primary
            label: Drop-in message
            type: string
            required: true
          - name: secondary
            label: Contact button text
            type: string
            required: true
      - name: media
        label: Program photo gallery
        type: object
        required: false
        fields:
          - name: heading
            label: Gallery heading
            type: string
          - name: subtitle
            label: Gallery introduction
            type: text
          - name: columns
            label: Photos per row
            type: number
            options:
              min: 1
              max: 3
          - name: maxWidth
            label: Gallery width
            type: select
            description: Choose how wide the gallery can grow on large screens.
            options:
              values:
                - name: 720px
                  label: Compact
                - name: 760px
                  label: Medium
                - name: 1100px
                  label: Wide
                - name: 1400px
                  label: Extra wide
          - name: photos
            label: Photos
            type: object
            required: false
            fields:
              - name: src
                label: Photo
                type: image
                required: true
                options:
                  media: program_photos
              - name: alt
                label: Describe this photo
                type: string
                required: true
                description: Describe the activity without naming children.
              - name: position
                label: Crop position
                type: select
                description: Choose which part of the photo stays visible in its crop.
                default: center
                options:
                  values:
                    - name: center
                      label: Centre
                    - name: center top
                      label: Top
                    - name: center bottom
                      label: Bottom
                    - name: left
                      label: Left
                    - name: right
                      label: Right
            list:
              min: 0
              max: 6
              collapsible:
                collapsed: true
                summary: "{fields.alt}"
          - name: video
            label: Program video
            type: object
            required: true
            description: Choose an MP4 and poster, then switch it on. Use a compressed MP4 under 25 MB. Uploading a video
              does not compress it.
            fields:
              - name: enabled
                label: Show video
                type: boolean
                required: true
              - name: src
                label: MP4 video
                type: file
                options:
                  media: program_videos
                  extensions:
                    - mp4
              - name: poster
                label: Poster image
                type: image
                options:
                  media: program_photos
              - name: title
                label: Video description
                type: string
              - name: autoplay
                label: Play automatically when visible (muted)
                type: boolean
                required: true
