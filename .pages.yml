# Practice website - staff essentials first. See CMS-STAFF-GUIDE.md.
settings:
  content:
    merge: true
media:
  - name: program_photos
    label: Program and news photos
    input: src/assets/images
    output: /src/assets/images
    extensions:
      - jpg
      - jpeg
      - png
      - webp
      - avif
    rename: safe
  - name: about_photos
    label: About portraits and logos
    input: public/Images/About
    output: /Images/About
    extensions:
      - jpg
      - jpeg
      - png
      - webp
      - avif
    rename: safe
  - name: policies
    label: Policy PDFs
    input: public/policies
    output: /policies
    extensions:
      - pdf
    rename: safe
  - name: guides
    label: Parent guide PDFs
    input: public/guides
    output: /guides
    extensions:
      - pdf
    rename: safe
  - name: term_dates
    label: Term calendar images
    input: public/Images/Dates
    output: /Images/Dates
    extensions:
      - jpg
      - jpeg
      - png
      - webp
      - avif
    rename: safe
content:
  - name: essential
    label: Essential
    type: group
    items:
      - name: school_holidays
        label: Holiday Program
        type: file
        path: src/content/holidays.json
        format: json
        operations:
          create: false
          rename: false
          delete: false
        fields:
          - name: status
            label: Holiday program status
            type: select
            required: true
            options:
              values:
                - name: open
                  label: Open — show details and booking links
                - name: coming_soon
                  label: Coming soon — dates not announced
                - name: closed
                  label: Closed — program has finished
            description: Also controls the homepage promotion. Closed/Coming soon hide old dates and session details.
          - name: dates
            label: Holiday dates
            type: string
            required: true
            description: Overall holiday date range shown in the heading and homepage promotion. Enter actual running
              dates separately under each program.
          - name: notice
            label: Optional closure or extra information
            type: text
            required: false
          - name: booking_url
            label: Holiday booking link
            type: string
            required: true
            pattern:
              regex: ^https://[^\s]+$
              message: Use a full https:// address.
          - name: playgym_enabled
            label: Include PlayGym drop-in sessions
            type: boolean
            required: true
          - name: playgym_schedule
            label: PlayGym holiday sessions
            type: object
            required: false
            fields:
              - name: week_1
                label: Week 1
                type: object
                required: false
                description: Add one item per running date. Remove a session to stop listing that date. Also update iClassPro. Leave the list empty if this
                  program does not run that week.
                fields:
                  - name: date
                    label: Date
                    type: date
                    required: true
                    default: ""
                    options:
                      time: false
                      format: yyyy-MM-dd
                  - name: time
                    label: Session time
                    type: string
                    required: true
                    description: For example 2:30pm - 4:00pm. Each date can have its own time.
                    pattern:
                      regex: ^(?:[1-9]|1[0-2]):[0-5][0-9] ?(?:am|pm) [\u2013\u2014-] (?:[1-9]|1[0-2]):[0-5][0-9] ?(?:am|pm)$
                      message: Use 2:30pm - 4:00pm, with spaces around the dash.
                list:
                  min: 0
                  max: 28
                  collapsible:
                    collapsed: true
                    summary: "{fields.date} | {fields.time}"
              - name: week_2
                label: Week 2
                type: object
                required: false
                description: Add one item per running date. Remove a session to stop listing that date. Also update iClassPro. Leave the list empty if this
                  program does not run that week.
                fields:
                  - name: date
                    label: Date
                    type: date
                    required: true
                    default: ""
                    options:
                      time: false
                      format: yyyy-MM-dd
                  - name: time
                    label: Session time
                    type: string
                    required: true
                    description: For example 2:30pm - 4:00pm. Each date can have its own time.
                    pattern:
                      regex: ^(?:[1-9]|1[0-2]):[0-5][0-9] ?(?:am|pm) [\u2013\u2014-] (?:[1-9]|1[0-2]):[0-5][0-9] ?(?:am|pm)$
                      message: Use 2:30pm - 4:00pm, with spaces around the dash.
                list:
                  min: 0
                  max: 28
                  collapsible:
                    collapsed: true
                    summary: "{fields.date} | {fields.time}"
          - name: programs
            label: Booked holiday programs
            type: object
            required: true
            fields:
              - name: id
                label: Reference
                type: string
                required: true
                hidden: true
                readonly: true
              - name: enabled
                label: Show this program
                type: boolean
                required: true
              - name: title
                label: Program name
                type: string
                required: true
              - name: ages
                label: Ages
                type: string
                required: true
              - name: description
                label: Description
                type: text
                required: true
              - name: week_1
                label: Week 1
                type: object
                required: false
                description: Add one item per running date. Remove a session to stop listing that date. Also update iClassPro. Leave the list empty if this
                  program does not run that week.
                fields:
                  - name: date
                    label: Date
                    type: date
                    required: true
                    default: ""
                    options:
                      time: false
                      format: yyyy-MM-dd
                  - name: time
                    label: Session time
                    type: string
                    required: true
                    description: For example 2:30pm - 4:00pm. Each date can have its own time.
                    pattern:
                      regex: ^(?:[1-9]|1[0-2]):[0-5][0-9] ?(?:am|pm) [\u2013\u2014-] (?:[1-9]|1[0-2]):[0-5][0-9] ?(?:am|pm)$
                      message: Use 2:30pm - 4:00pm, with spaces around the dash.
                  - name: activity
                    label: Workshop name (optional)
                    type: string
                    description: For example Handstands & Cartwheels. Leave blank for a general session.
                list:
                  min: 0
                  max: 28
                  collapsible:
                    collapsed: true
                    summary: "{fields.date} | {fields.time}"
              - name: week_2
                label: Week 2
                type: object
                required: false
                description: Add one item per running date. Remove a session to stop listing that date. Also update iClassPro. Leave the list empty if this
                  program does not run that week.
                fields:
                  - name: date
                    label: Date
                    type: date
                    required: true
                    default: ""
                    options:
                      time: false
                      format: yyyy-MM-dd
                  - name: time
                    label: Session time
                    type: string
                    required: true
                    description: For example 2:30pm - 4:00pm. Each date can have its own time.
                    pattern:
                      regex: ^(?:[1-9]|1[0-2]):[0-5][0-9] ?(?:am|pm) [\u2013\u2014-] (?:[1-9]|1[0-2]):[0-5][0-9] ?(?:am|pm)$
                      message: Use 2:30pm - 4:00pm, with spaces around the dash.
                  - name: activity
                    label: Workshop name (optional)
                    type: string
                    description: For example Handstands & Cartwheels. Leave blank for a general session.
                list:
                  min: 0
                  max: 28
                  collapsible:
                    collapsed: true
                    summary: "{fields.date} | {fields.time}"
              - name: price
                label: Price
                type: string
                required: true
            list:
              min: 2
              max: 2
              collapsible:
                collapsed: true
                summary: "{fields.title}"
            description: OpenGym and Skill Workshops each have their own Week 1 and Week 2 dates. The optional workshop
              name can be left blank for OpenGym.
      - name: policies
        label: Policies
        type: file
        path: src/content/policies.json
        format: json
        operations:
          create: false
          rename: false
          delete: false
        fields:
          - name: documents
            label: Current policies
            type: object
            required: true
            fields:
              - name: title
                label: Document title
                type: string
                required: true
              - name: href
                label: PDF document
                type: file
                required: true
                options:
                  media: policies
                  extensions:
                    - pdf
              - name: description
                label: Description
                type: text
            list:
              min: 1
              max: 30
              collapsible:
                collapsed: true
                summary: "{fields.title}"
          - name: guides
            label: Parent guides
            type: object
            required: true
            fields:
              - name: documents
                label: Guides
                type: object
                required: false
                fields:
                  - name: title
                    label: Document title
                    type: string
                    required: true
                  - name: href
                    label: PDF document
                    type: file
                    required: true
                    options:
                      media: guides
                      extensions:
                        - pdf
                  - name: description
                    label: Description
                    type: text
                list:
                  min: 0
                  max: 30
                  collapsible:
                    collapsed: true
                    summary: "{fields.title}"
          - name: legacy
            label: Older policies
            type: object
            required: false
            fields:
              - name: title
                label: Document title
                type: string
                required: true
              - name: href
                label: PDF document
                type: file
                required: true
                options:
                  media: policies
                  extensions:
                    - pdf
              - name: description
                label: Description
                type: text
