                    label: Day
                    type: select
                    required: true
                    options:
                      values:
                        - Monday
                        - Tuesday
                        - Wednesday
                        - Thursday
                        - Friday
                        - Saturday
                        - Sunday
                  - name: time
                    label: Session time
                    type: string
                    required: true
                    pattern:
                      regex: ^(?:[1-9]|1[0-2]):[0-5][0-9](?:am|pm) [–—-]
                        (?:[1-9]|1[0-2]):[0-5][0-9](?:am|pm)$
                      message: Use 11:00am - 12:30pm, with spaces around the dash.
