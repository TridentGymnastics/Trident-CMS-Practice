  - name: announcements
    label: PRACTICE - News updates
    type: file
    path: src/content/announcements.json
    format: json
    operations:
      create: false
      rename: false
      delete: false
    fields:
      - name: items
        label: Updates
        type: object
        required: false
        fields:
          - name: live
            label: Publish this update
            type: boolean
            required: true
            description: Switch off to hide without deleting. This appears on the What's happening page.
          - name: id
            label: Reference name
            type: string
            required: true
            pattern:
              regex: ^[a-z0-9]+(?:-[a-z0-9]+)*$
              message: Use a unique name such as spring-news-2026.
            description: Unique name using lowercase words and hyphens, e.g. spring-news-2026.
          - name: title
            label: Headline
            type: string
            required: true
          - name: date
            label: Displayed date
            type: string
            required: true
          - name: dateISO
            label: Date for sorting
            type: string
            required: true
            pattern:
              regex: ^\d{4}-\d{2}-\d{2}$
              message: Use YYYY-MM-DD, for example 2026-09-22.
            description: Controls newest-first order; does not schedule automatic publication.
          - name: tag
            label: Category label
            type: string
          - name: body
            label: Paragraphs
            type: text
            required: true
            list:
              min: 1
              max: 20
          - name: images
            label: Photos
            type: object
            required: false
            fields:
              - name: src
                label: Photo
                type: image
                required: true
                options:
                  media: program_photos
              - name: alt
                label: Describe this photo
                type: string
                required: true
            list:
              min: 0
              max: 4
              collapsible:
                collapsed: true
                summary: "{fields.alt}"
        list:
          min: 0
          max: 100
          collapsible:
            collapsed: true
            summary: "{fields.title}"
