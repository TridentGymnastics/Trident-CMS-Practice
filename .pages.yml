settings:
  content:
    merge: true
media:
  - name: program_photos
    label: Program photos
    input: src/assets/images
    output: /src/assets/images
    extensions:
      - jpg
      - jpeg
      - png
      - webp
      - avif
    rename: safe
  - name: about_photos
    label: About portraits and logos
    input: public/Images/About
    output: /Images/About
    extensions:
      - jpg
      - jpeg
      - png
      - webp
      - avif
    rename: safe
  - name: policies
    label: Policy PDFs
    input: public/policies
    output: /policies
    extensions:
      - pdf
    rename: safe
  - name: guides
    label: Parent guide PDFs
    input: public/guides
    output: /guides
    extensions:
      - pdf
    rename: safe
  - name: term_dates
    label: Term calendar images
    input: public/Images/Dates
    output: /Images/Dates
    extensions:
      - jpg
      - jpeg
      - png
      - webp
      - avif
    rename: safe
content:
  - name: essential
    label: Essential
    type: group
    items:
      - name: school_holidays
        label: Holiday Program
        type: file
        path: src/content/holidays.json
        format: json
        operations:
          create: false
          rename: false
          delete: false
        fields:
          - name: status
            label: Holiday program status
            type: select
            required: true
            options:
              values:
                - name: open
                  label: Open — show details and booking links
                - name: coming_soon
                  label: Coming soon — dates not announced
                - name: closed
                  label: Closed — program has finished
            description: Also controls the homepage promotion. Closed/Coming soon hide old
              dates and session details.
          - name: season
            label: Season
            type: select
            required: true
            options:
              values:
                - name: winter
                  label: Winter - falling snow
                - name: autumn
                  label: Autumn - falling leaves
                - name: spring
                  label: Spring - flowers
                - name: summer
                  label: Summer - sunshine
            description: Themes holiday pages and homepage holiday sections. Existing
              uploaded PDFs and images are not recoloured.
          - name: dates
            label: Holiday dates
            type: string
            required: true
            description: Overall holiday date range shown in the heading and homepage
              promotion. Enter actual running dates separately under each
              program.
          - name: notice
            label: Optional closure or extra information
            type: text
            required: false
          - name: booking_url
            label: Holiday booking link
            type: string
            required: true
            pattern:
              regex: ^https://[^\s]+$
              message: Use a full https:// address.
          - name: playgym
            label: PlayGym
            type: object
            required: true
            list:
              min: 1
              max: 1
              collapsible:
                collapsed: true
                summary: PlayGym
            fields:
