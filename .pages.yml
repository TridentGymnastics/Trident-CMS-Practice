      - name: site_notice
        label: Site-wide Notices
        type: file
        path: src/content/site-notice.json
        format: json
        operations:
          create: false
          rename: false
          delete: false
        fields:
          - name: enabled
            label: Show this notice
            type: boolean
            required: true
            description: "Before editing: check live versus practice repository. Save this
              page before opening another editor, then check the website after
              deployment. Shows on every page. Saving updates the connected
              website after deployment."
          - name: tone
            label: Notice colour
            type: select
            required: true
            options:
              values:
                - name: info
                  label: Blue information notice
                - name: important
                  label: Yellow important notice
                - name: success
                  label: Green
                - name: urgent
                  label: Rose
                - name: lavender
                  label: Lavender
                - name: peach
                  label: Peach
                - name: navy
                  label: Navy
                - name: teal
                  label: Teal
            description: Choose a prepared notice colour. Use clear wording for closures;
              colour alone does not change urgency behaviour.
          - name: heading
            label: Heading
            type: string
            required: true
            description: Short heading families will see above this information.
          - name: message
            label: Message
            type: text
            description: Write the announcement families need to read, including relevant
              dates. Remove outdated information.
          - name: link_text
            label: Optional link text
            type: string
            description: Optional link wording, for example View holiday programs. Also
              enter a destination, or leave both link fields blank.
          - name: link_href
            label: Optional link destination
            type: string
            pattern:
              regex: (?:^$)|(?:^(?:/(?!/)[^\\\s]*|https://[^\s]+|#[A-Za-z][A-Za-z0-9_-]*)$)
              message: Use a page path such as /playgym, or a full https:// address.
            description: Use a website path such as /school-holidays or a full https://
              address. Supply link text above as well; clear both fields to
              remove the link.
  - name: program_pages
    label: Program information
    type: group
    items:
      - name: playgym_practice
        label: PlayGym
        type: file
        path: src/content/playgym.json
        format: json
        operations:
          create: false
          rename: false
          delete: false
        fields:
          - name: title
            label: Program name
            type: string
            required: true
            description: "Before editing: check live versus practice repository. Save this
              page before opening another editor, then check the website after
              deployment. Updates the website labels. The page address stays
              /playgym."
            options:
              maxlength: 60
          - name: age_range
            label: Age range
            type: string
            required: true
            description: Displayed ages, for example 0–6 years.
            pattern:
              regex: ^[0-9]+(?:\.[0-9]+)?[–-][0-9]+(?:\.[0-9]+)? years$
              message: Use a range such as 0–6 years.
          - name: session_length
            label: Session length
            type: string
            required: true
            description: Usual session duration, for example 1.5 hours. Holiday times are
              managed separately.
          - name: adult_helper_required
            label: Adult helper required
            type: boolean
            required: true
            description: Updates supervision labels on the website. Also review your written
              descriptions and policies when changing how sessions operate.
          - name: tagline
            label: Short description
            type: text
            required: true
            description: Short introduction below the PlayGym heading. Keep it clear and
              welcoming.
          - name: about
            label: About PlayGym paragraphs
            type: text
            required: true
            list:
              min: 1
              max: 20
            description: Each item is a paragraph in About PlayGym. Add, remove or drag
              items to arrange the text.
          - name: schedule
            label: Regular PlayGym timetable
            type: object
            required: true
            fields:
              - name: days
                label: Sessions
                type: object
                required: true
                fields:
                  - name: day
                    label: Day
                    type: select
                    required: true
                    options:
                      values:
                        - Monday
                        - Tuesday
                        - Wednesday
                        - Thursday
                        - Friday
                        - Saturday
                        - Sunday
                    description: Choose a regular weekly opening day. Holiday dates are managed
                      separately.
                  - name: time
                    label: Session time
                    type: string
                    required: true
                    pattern:
                      regex: ^(?:[1-9]|1[0-2]):[0-5][0-9](?:am|pm) [–—-]
                        (?:[1-9]|1[0-2]):[0-5][0-9](?:am|pm)$
                      message: Use 11:00am - 12:30pm, with spaces around the dash.
                    description: Enter the complete time range, for example 11:00am - 12:30pm. Check
                      both times before saving.
                  - name: isNew
                    label: Show New badge
                    type: boolean
                    description: Switch on to mark this session as new. Switch off once families are
                      familiar with it.
                list:
                  min: 1
                  max: 21
                  collapsible:
                    collapsed: true
                    summary: "{fields.day}"
                description: Updates regular drop-in times on the PlayGym page. Holiday times
                  are edited separately in School holidays.
            description: Regular drop-in days and times. Holiday opening times are in School
              holidays.
          - name: prices
            label: Prices and passes
            type: object
            required: true
            fields:
              - name: items
                label: Pass options
                type: object
                required: true
                fields:
                  - name: label
                    label: Pass name
                    type: string
                    required: true
                    description: Pass or visit name, for example 1x Visit or 5x Pass.
                  - name: price
                    label: Displayed price
                    type: string
                    required: true
                    description: Include the dollar sign and who the price covers, for example $15
                      per child. This does not change iClassPro prices.
                list:
                  min: 1
                  max: 8
                  collapsible:
                    collapsed: true
                    summary: "{fields.label}"
                description: Keep the casual single-visit price first; School holidays uses that
                  price too.
            description: Update displayed PlayGym prices here. Update payment arrangements
              separately in iClassPro.
          - name: media
            label: Photos
            type: object
            required: false
            fields:
              - name: photos
                label: Photos
                type: object
                required: false
                fields:
                  - name: src
                    label: Photo
                    type: image
                    required: true
                    options:
                      media: program_photos
                    description: Select an existing photo or upload one the club has permission to
                      publish. Keep library files that other pages may use.
                  - name: alt
                    label: Describe this photo
                    type: string
                    required: true
                    description: Describe the activity without naming children.
                  - name: position
                    label: Crop position
                    type: select
                    description: Choose which part of the photo stays visible in its crop.
                    default: center
                    options:
                      values:
                        - name: center
                          label: Centre
                        - name: center top
                          label: Top
                        - name: center bottom
                          label: Bottom
                        - name: left
                          label: Left
                        - name: right
                          label: Right
                list:
                  min: 0
                  max: 6
                  collapsible:
                    collapsed: true
                    summary: "{fields.alt}"
                description: Add, replace or drag photo rows to reorder them. Removing a row
                  removes it from this gallery, not from the media library.
            description: Expand to select and arrange the photos on this program page.
